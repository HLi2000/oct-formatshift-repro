[project]
name = "oct-formatshift-repro"
version = "0.1.0"
description = "Reproducibility package for the OCT-FormatShift benchmark (paper + code + committed results)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ufonia Science Team" }]
# Slim, paper-build-only dependency set (no torch): reproduces every table + all figures.
# The heavier contender/panel-generation stack (torch, openai, google-genai, ...) is NOT needed here.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glaucoma_triage"]
